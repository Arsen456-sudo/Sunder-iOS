name: Fork feature request
description: Describe a user problem and proposed improvement for this fork
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and affected platforms
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, compatibility and resource-license considerations
